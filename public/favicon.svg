<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flask-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff782d"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="fluid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241f19"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#ea580c" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Conical Flask Body -->
  <g filter="url(#glow)">
    <!-- Flask Outline / Glass -->
    <path
      d="M27 12h10M29 12v9.5L16.4 43.6A4 4 0 0 0 19.9 49h24.2a4 4 0 0 0 3.5-5.4L35 21.5V12"
      fill="none"
      stroke="#f6f4ee"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Fluid Inside -->
    <path
      d="M21.2 38h21.6l3.6 5.8a3 3 0 0 1-2.6 4.2H20.2a3 3 0 0 1-2.6-4.2L21.2 38z"
      fill="url(#fluid-grad)"
    />

    <!-- Bubble / Sparkle in fluid -->
    <circle cx="27" cy="42.5" r="1.75" fill="#fff7ed" fill-opacity="0.9"/>
    <circle cx="35.5" cy="40.5" r="1.25" fill="#fff7ed" fill-opacity="0.75"/>
    <circle cx="32" cy="33" r="1" fill="#f97316" fill-opacity="0.9"/>
  </g>
</svg>